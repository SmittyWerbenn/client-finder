name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    name: Build static demo
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Aplikasi penuh butuh Node runtime (API routes, cookie, JSON store).
      # Untuk Pages kita buang bagian server lalu build sebagai demo statis.
      - name: Strip server-only code
        run: rm -rf app/api proxy.ts

      - name: Build static export
        run: npm run build
        env:
          NEXT_STATIC_EXPORT: '1'
          NEXT_PUBLIC_DEMO: '1'
          NEXT_BASE_PATH: /client-finder

      - name: Disable Jekyll
        run: touch out/.nojekyll

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    name: Deploy
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
