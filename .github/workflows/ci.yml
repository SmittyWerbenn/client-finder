name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Typecheck & build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Build (mode server)
        run: npm run build

  static-demo:
    name: Build demo statis (GitHub Pages)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Pages hanya menyajikan file statis: route handler + proxy dibuang.
      - name: Strip server-only code
        run: rm -rf app/api proxy.ts

      - name: Build static export
        run: npm run build
        env:
          NEXT_STATIC_EXPORT: '1'
          NEXT_PUBLIC_DEMO: '1'
          NEXT_BASE_PATH: /client-finder
